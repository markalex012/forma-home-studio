name: Build FORMA Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'studio-core.js', 'studio.js', 'tests/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

concurrency:
  group: forma-tv-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: forma-studio-personal-signing-v1
      - name: Test studio data and checker
        run: |
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -p '*_test.py'
      - name: Compile, test and lint
        run: gradle --no-daemon -p android :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/FORMA-Studio-1.0.0.apk
          cd output
          sha256sum FORMA-Studio-1.0.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FORMA-Studio-1.0.0
          path: output/*
          retention-days: 30
      - name: Publish installable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-studio-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" output/FORMA-Studio-1.0.0.apk output/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'FORMA Studio 1.0 — mouse edition' --notes-file android/RELEASE_NOTES.md
