name: Build FORMA TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

concurrency:
  group: forma-tv-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile, test and lint
        run: gradle --no-daemon -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/FORMA-TV-0.1.0.apk
          cd output
          sha256sum FORMA-TV-0.1.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FORMA-TV-0.1.0
          path: output/*
          retention-days: 30
      - name: Publish installable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" output/FORMA-TV-0.1.0.apk output/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title 'FORMA TV 0.1 — Android TV preview' --notes-file android/RELEASE_NOTES.md
