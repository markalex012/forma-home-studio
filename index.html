function translate(){document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';$('#uiLanguage').value=lang;document.title='LK Studio — '+(lang==='ru'?'Домашняя студия':lang==='he'?'הסטודיו הביתי':'Your home studio');const map={heroEyebrow:'eyebrow',heroText:'heroText',explore:'explore',heroNote:'heroNote',heroBottom:'heroBottom',introEyebrow:'introEyebrow',introTitle:'introTitle',introText:'introText',libraryEyebrow:'libraryEyebrow',equipmentEyebrow:'equipmentEyebrow',equipmentTitle:'equipmentTitle',equipmentText:'equipmentText',equipmentNote:'equipmentNote',closingTitle:'closingTitle',closingText:'closingText',footerText:'footer',catalogNote:'catalogNote',reset:'reset'};for(const[id,key]of Object.entries(map))$('#'+id).textContent=t()[key];$('#heroTitle').innerHTML=t().hero;$('#search').placeholder=t().search;$('#search').setAttribute('aria-label',t().search);$('#tvMode').setAttribute('aria-label',t().tv);$('#closePlayer').setAttribute('aria-label',lang==='ru'?'Закрыть':lang==='he'?'סגירה':'Close');options($('#videoLanguage'),[['',t().allLanguages],...Object.entries(languageNames)]);options($('#duration'),[['',t().duration],['short',t().short],['medium',t().medium],['long',t().long]]);options($('#level'),[['',t().levels],['beginner',t().beginner],['moderate',t().moderate]]);options($('#equipment'),[['',t().anyEquipment],['none',t().none],['mat',t().mat],['dumbbells',t().dumbbells],['owned',t().owned]]);[['videoLanguage','allLanguages'],['duration','duration'],['level','levels'],['equipment','anyEquipment']].forEach(([id,k])=>$('#'+id).setAttribute('aria-label',t()[k]));renderNav();renderCategories();renderEquipment();renderCards();if(current&&$('#player').open)renderPlayerText()}
function renderNav(){$('#nav').innerHTML=t().nav.map((n,i)=>`<button data-nav="${i}" class="${(view==='favorites'?i===1:i===0)?'active':''}">${n}${i===1&&favorites.size?' · '+favorites.size:''}</button>`).join('')}
function renderCategories(){$('#categories').innerHTML=cats.map((c,i)=>`<button class="category ${category===c?'active':''}" data-cat="${c}" aria-pressed="${category===c}"><img src="${photo(c,500)}" alt="" loading="lazy"><span class="cat-number">0${i+1}</span><span class="cat-text"><strong>${t().categories[i]}</strong><small>${countText(workouts.filter(w=>w.cat===c).length)}</small></span></button>`).join('')}

function matching(){const q=$('#search').value.trim().toLocaleLowerCase();return workouts.filter(w=>{const dur=$('#duration').value,eq=$('#equipment').value;return w.lang===lang&&(!w.archived||view==='favorites')&&(!category||w.cat===category)&&(view!=='favorites'||favorites.has(w.id))&&(!$('#videoLanguage').value||w.lang===$('#videoLanguage').value)&&(!$('#level').value||w.level===$('#level').value)&&(!q||[...w.title,w.coach].join(' ').toLocaleLowerCase().includes(q))&&(!dur||(dur==='short'?w.min<=10:dur==='medium'?w.min>10&&w.min<=20:w.min>20))&&(!eq||(eq==='none'?w.eq.length===0:eq==='owned'?w.eq.every(e=>owned.has(e)):w.eq.includes(eq)))})}
function renderCards(){const found=matching();$('#libraryTitle').textContent=t()[view==='favorites'?'favTitle':'libraryTitle'];$('#resultCount').textContent=countText(found.length);$('#activeSummary').replaceChildren();if(category){const b=document.createElement('button');b.textContent=t().categories[cats.indexOf(category)]+' ×';b.onclick=()=>{category='';renderCategories();renderCards()};$('#activeSummary').append(b)}$('#cards').innerHTML=found.map(w=>`<article class="workout"><div class="card-photo"><img src="https://i.ytimg.com/vi/${w.id}/hqdefault.jpg" alt="${escapeText(w.coach)}" loading="lazy" data-fallback="${w.cat}"><button class="launch" data-play="${w.id}" aria-label="${t().view}: ${escapeText(title(w))}"></button><span class="language-badge">${languageNames[w.lang]}</span><button class="favorite ${favorites.has(w.id)?'saved':''}" data-fav="${w.id}" aria-label="${favorites.has(w.id)?t().remove:t().add}" aria-pressed="${favorites.has(w.id)}">${favorites.has(w.id)?'♥':'♡'}</button><span class="duration-badge">${w.min} ${t().min}</span></div><div class="card-body"><div class="card-kicker"><span>${t().categories[cats.indexOf(w.cat)]}</span><span>${t()[w.level]}</span></div><h3>${escapeText(title(w))}</h3><p class="coach">${escapeText(w.coach)}</p><div class="card-bottom"><small>${eqText(w)}</small><button data-play="${w.id}">${t().start}</button></div></div></article>`).join('');$('#cards').querySelectorAll('img').forEach(img=>img.onerror=()=>{img.onerror=null;img.src=photo(img.dataset.fallback,800)});$('#empty').hidden=found.length>0;$('#empty').textContent=view==='favorites'&&!favorites.size?t().emptyFav:t().empty;renderNav()}
function toggleFavorite(id){const had=favorites.has(id);had?favorites.delete(id):favorites.add(id);write('forma.favorites',[...favorites]);renderCards();if(current)renderPlayerText();toast(t()[had?'removed':'saved'])}
let toastTimer;function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),2300)}
function renderPlayerText(){$('#playerTitle').textContent=title(current);$('#playerCoach').textContent=current.coach+' · '+languageNames[current.lang];$('#playerHelp').textContent=t().playerHelp;$('#youtubeLink').textContent=t().youtube;$('#youtubeLink').href='https://www.youtube.com/watch?v='+current.id;$('#playerFavorite').textContent=favorites.has(current.id)?'♥ '+t().remove:'♡ '+t().add}
function play(id){current=workouts.find(w=>w.id===id);if(!current)return;renderPlayerText();const frame=document.createElement('iframe');frame.src=`https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0`;frame.title=title(current);frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';$('#playerFrame').replaceChildren(frame);$('#player').showModal();$('#closePlayer').focus()}
$('#uiLanguage').onchange=e=>{lang=e.target.value;write('forma.lang',lang);translate()};$('#categories').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;category=category===b.dataset.cat?'':b.dataset.cat;view='studio';renderCategories();renderCards();$('#library').scrollIntoView()};$('#cards').onclick=e=>{const f=e.target.closest('[data-fav]');if(f)return toggleFavorite(f.dataset.fav);const p=e.target.closest('[data-play]');if(p)play(p.dataset.play)};$('#nav').onclick=e=>{const b=e.target.closest('[data-nav]');if(!b)return;const n=Number(b.dataset.nav);if(n===2){$('#equipmentSection').scrollIntoView();return}view=n===1?'favorites':'studio';category='';resetFilters();renderCategories();renderCards();(n===1?$('#library'):$('.hero')).scrollIntoView()};$('#explore').onclick=()=>{view='studio';renderCards();$('#library').scrollIntoView()};$('#search').oninput=renderCards;for(const id of ['videoLanguage','duration','level','equipment'])$('#'+id).onchange=renderCards;
function resetFilters(){$('#search').value='';['videoLanguage','duration','level','equipment'].forEach(id=>$('#'+id).value='')}
$('#reset').onclick=()=>{resetFilters();category='';renderCategories();renderCards()};$('#equipmentList').onchange=e=>{const key=e.target.dataset.eq;if(!key)return;e.target.checked?owned.add(key):owned.delete(key);write('forma.equipment',[...owned]);renderCards()};$('#closePlayer').onclick=()=>$('#player').close();$('#player').addEventListener('close',()=>{$('#playerFrame').replaceChildren();current=null});$('#player').onclick=e=>{if(e.target===$('#player')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}};$('#playerFavorite').onclick=()=>current&&toggleFavorite(current.id);
const initialTV=read('forma.tv',false);document.body.classList.toggle('tv',initialTV);$('#tvMode').classList.toggle('active',initialTV);$('#tvMode').setAttribute('aria-pressed',initialTV);$('#tvMode').onclick=()=>{const on=document.body.classList.toggle('tv');$('#tvMode').classList.toggle('active',on);$('#tvMode').setAttribute('aria-pressed',on);write('forma.tv',on)};
// Spatial keyboard navigation for remotes; native select/input editing remains intact.
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#player').open){$('#player').close();return}if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)||['INPUT','SELECT','TEXTAREA','IFRAME'].includes(document.activeElement.tagName))return;const root=$('#player').open?$('#player'):document;const items=[...root.querySelectorAll('button,a[href],select,input')].filter(el=>el.getClientRects().length&&!el.disabled);const active=document.activeElement;if(!items.includes(active)){items[0]?.focus();e.preventDefault();return}const r=active.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;let best=null,score=Infinity;for(const el of items){if(el===active)continue;const b=el.getBoundingClientRect(),dx=b.left+b.width/2-x,dy=b.top+b.height/2-y,horizontal=['ArrowLeft','ArrowRight'].includes(e.key);if(e.key==='ArrowLeft'&&dx>=-5||e.key==='ArrowRight'&&dx<=5||e.key==='ArrowUp'&&dy>=-5||e.key==='ArrowDown'&&dy<=5)continue;const primary=horizontal?Math.abs(dx):Math.abs(dy),cross=horizontal?Math.abs(dy):Math.abs(dx);const s=primary+cross*3;if(s<score){score=s;best=el}}if(best){e.preventDefault();best.focus()}});
